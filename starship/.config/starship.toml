palette = "noctalia"
# Akari: lantern-lit, warm, quiet. ANSI color names only, so it follows theme switches.
# bright-black = muted sand, yellow = lantern gold, red = coral, cyan = soft teal.
add_newline = true
command_timeout = 200
format = """
[╭─](bright-black)$directory$git_branch$git_state$git_status$fill$php$nodejs$python$rust$golang$cmd_duration
[╰─](bright-black)[灯](bold red) $character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bright-black)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"

[directory]
style = "bold yellow"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"
repo_root_style = "bold yellow"
repo_root_format = " [ ](yellow)[$repo_root]($repo_root_style)[$path](yellow)[$read_only]($read_only_style) "
format = " [ ](yellow)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "cyan"
format = "[·](bright-black) [$symbol$branch]($style) "

[git_state]
style = "bold red"
format = "[$state( $progress_current/$progress_total)]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
conflicted = "=${count} "
untracked = "?${count} "
modified = "!${count} "
staged = "[+${count} ](green)"
renamed = "»${count} "
deleted = "✘${count} "
stashed = "[≡ ](bright-black)"

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[  $duration]($style)"

[php]
symbol = " "
style = "bright-black"
format = "[ $symbol$version]($style)"

[nodejs]
symbol = " "
style = "bright-black"
format = "[ $symbol$version]($style)"

[python]
symbol = " "
style = "bright-black"
format = "[ $symbol$version( \\($virtualenv\\))]($style)"

[rust]
symbol = " "
style = "bright-black"
format = "[ $symbol$version]($style)"

[golang]
symbol = " "
style = "bright-black"
format = "[ $symbol$version]($style)"

